<!DOCTYPE html>
<html lang="en">
<head>

  <title>Rexgot Style Example</title>

  <!-- Rexgot CSS -->
  <link rel="stylesheet" href="dist/css/rexgot.min.css">
</head>
<body>

  <div class="container">
    <button class="btn btn-primary">Rexgot Button</button>

  <h2>How to get Card</h2>

    <a href="#" class="btn btn-primary mt-3">Go somewhere</a>

  <div class="card-footer text-muted">2 days ago</div>
  </div>
